<div style="background:#ece2cb;color:#221c10;font-family:'Geist',sans-serif;min-height:100%;overflow-x:hidden">

  <section style="position:relative;padding:clamp(40px,6vw,64px) clamp(20px,4vw,40px) 24px;max-width:1180px;margin:0 auto">
    <svg class="ks-kite" width="60" height="60" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;top:8px;right:24px;animation:bob 5s ease-in-out infinite;z-index:2;pointer-events:none"><polygon points="32,4 52,26 32,48 12,26" fill="#b07227"></polygon><line x1="32" y1="4" x2="32" y2="48" stroke="#ece2cb" stroke-width="1.6"></line><line x1="12" y1="26" x2="52" y2="26" stroke="#ece2cb" stroke-width="1.6"></line><path d="M32 48 Q38 54 32 58 Q26 62 32 64" stroke="#b07227" stroke-width="1.8" stroke-linecap="round" fill="none"></path></svg>
    <div style="display:flex;align-items:center;gap:10px;font:600 12px 'Geist Mono',monospace;text-transform:uppercase;letter-spacing:.16em;color:#2f5436;margin-bottom:22px">

    <div style="display:flex;flex-wrap:wrap;gap:clamp(24px,5vw,56px);align-items:flex-end">
      <h1 style="font:800 clamp(48px,8vw,104px)/.9 'Geist',sans-serif;letter-spacing:-.045em;color:#1d1810;margin:0;flex:1 1 360px">The<br><span style="font-style:italic;font-weight:700;color:#2f5436">logbook.</span></h1>
      <p style="font:400 18px/1.6 'Geist',sans-serif;color:#5e5238;margin:0;max-width:460px;flex:1 1 320px">Thinking out loud on training, longevity, nutrition, AI, culture, and what it actually takes to build alone. Long-form, infrequent, written by hand — plus the occasional link out to writing worth your time.</p>
    </div>
  </section>

  <section style="padding:0 clamp(20px,4vw,40px);max-width:1180px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap;padding:18px 0;border-top:1px solid rgba(34,28,16,.16);border-bottom:1px solid rgba(34,28,16,.16)">
      <div id="chips" style="display:flex;gap:9px;flex-wrap:wrap"></div>
      <div id="legend" style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;font:600 11px 'Geist Mono',monospace;letter-spacing:.04em"></div>
    </div>
  </section>

  <section id="featuredSection" style="padding:clamp(34px,5vw,52px) clamp(20px,4vw,40px) 20px;max-width:1180px;margin:0 auto">
    <div id="featured"></div>
  </section>

  <section style="padding:clamp(28px,4vw,40px) clamp(20px,4vw,40px) clamp(48px,7vw,72px);max-width:1180px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;margin-bottom:6px">
      <h2 id="listHeading" style="font:700 22px 'Geist',sans-serif;letter-spacing:-.02em;color:#1d1810;margin:0">All essays</h2>
      <span id="shownCount" style="font:500 12px 'Geist Mono',monospace;color:#a89878">14 shown</span>
    </div>
    <div id="postList"></div>
  </section>

  <div data-ks="footer" data-active="writing"></div>

<script src="/blog/posts.js"></script>
<script>
(function () {
  // Blog entries are the shared list in /blog/posts.js (window.KS_POSTS) — the
  // single source of truth, also used by the home page's "From the log".
  // See docs/ADDING-A-BLOG-POST.md.
  var POSTS = (window.KS_POSTS || []).slice();

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function isExt(p) { return !!p.external; }
  // A post's category can be a string or an array — normalize to an array.
  function catsOf(p) { return Array.isArray(p.cat) ? p.cat : (p.cat ? [p.cat] : []); }
  function postHref(p) { return isExt(p) ? (p.url || "#") : (p.href || "/blog.html"); }
  function linkAttrs(p) { return isExt(p) ? ' target="_blank" rel="noopener"' : ''; }

  var introCount = document.getElementById("introCount");
  var chipsEl = document.getElementById("chips");
  var legendEl = document.getElementById("legend");
  var chipsSection = chipsEl.closest("section");
  var featuredSection = document.getElementById("featuredSection");
  var featuredEl = document.getElementById("featured");
  var listEl = document.getElementById("postList");
  var headingEl = document.getElementById("listHeading");
  var shownEl = document.getElementById("shownCount");

  // Empty state
  if (!POSTS.length) {
    introCount.textContent = "first essays landing soon";
    if (chipsSection) chipsSection.style.display = "none";
    if (featuredSection) featuredSection.style.display = "none";
    headingEl.textContent = "No essays yet";
    shownEl.textContent = "";
    listEl.innerHTML = '<p style="font:400 17px/1.6 \'Geist\',sans-serif;color:#8a7a58;padding:30px 0;border-top:1px solid rgba(34,28,16,.16)">The logbook is open but empty — the first essays are being written. Check back soon, or <a href="/" style="color:#2f5436">head home</a>.</p>';
    return;
  }

  introCount.textContent = POSTS.length + (POSTS.length === 1 ? " entry" : " entries") + " & counting";

  // Legend — show the "external" key only if there's at least one repost
  var hasExt = POSTS.some(isExt);
  legendEl.innerHTML =
    '<span style="display:flex;align-items:center;gap:6px;color:#2f5436"><span style="font-size:13px">✍</span>Mine</span>' +
    (hasExt ? '<span style="display:flex;align-items:center;gap:6px;color:#8a5a18"><span style="font-size:13px">↗</span>External link</span>' : '');

  // Featured card — newest featured (or newest overall); brass variant if external
  var featured = POSTS.filter(function (p) { return p.featured; })[0] || POSTS[0];
  (function () {
    var ext = isExt(featured);
    var accent = ext ? "#b07227" : "#2f5436";
    var panelBg = ext ? "linear-gradient(135deg,#b07227,#7c4f1c)" : "linear-gradient(135deg,#2f5436,#23402b)";
    var kicker = ext ? ("↗ Featured link" + (featured.source ? " · " + esc(featured.source) : "")) : ("Featured · " + catsOf(featured).map(esc).join(" · "));
    var metaLine = esc(featured.date) + (featured.read ? " · " + esc(featured.read) + (ext ? "" : " read") : "");
    var cta = ext ? ("Read on " + esc(featured.source || "their site")) : "Read the essay";
    var noteBlock = (ext && featured.note)
      ? '<p style="font:italic 400 15px/1.55 \'Geist\',sans-serif;color:#5e5238;margin:16px 0 0;padding-left:14px;border-left:2px solid #b07227"><span style="font:600 11px \'Geist Mono\',monospace;color:#8a5a18;display:block;margin-bottom:4px;letter-spacing:.06em">WHY I&#39;M FEATURING THIS</span>' + esc(featured.note) + '</p>'
      : '';
    featuredEl.innerHTML =
      '<a href="' + esc(postHref(featured)) + '"' + linkAttrs(featured) + ' class="hv2" style="display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,44px);align-items:stretch;border:1.5px solid rgba(34,28,16,.2);border-radius:16px;overflow:hidden;background:#f3ecd9;transition:transform .2s,box-shadow .2s">' +
        '<div style="flex:1 1 300px;min-height:240px;background:' + panelBg + ';position:relative;display:flex;align-items:flex-end;padding:26px">' +
          '<div aria-hidden="true" style="position:absolute;inset:0;opacity:.5;background:repeating-linear-gradient(125deg,transparent 0 16px,rgba(216,176,122,.14) 16px 17px)"></div>' +
          '<div style="position:relative"><div style="font:600 11px \'Geist Mono\',monospace;letter-spacing:.16em;text-transform:uppercase;color:#f0d9b0;margin-bottom:8px">' + kicker + '</div>' +
          '<div style="font:800 clamp(26px,3vw,38px)/1.04 \'Geist\',sans-serif;letter-spacing:-.03em;color:#f0e8d6">' + esc(featured.title) + '</div></div></div>' +
        '<div style="flex:1 1 320px;padding:clamp(24px,3vw,38px);display:flex;flex-direction:column;justify-content:center">' +
          '<div style="font:500 12px \'Geist Mono\',monospace;color:#a89878;margin-bottom:12px">' + metaLine + '</div>' +
          '<p style="font:400 18px/1.6 \'Geist\',sans-serif;color:#5e5238;margin:0">' + esc(featured.dek) + '</p>' +
          noteBlock +
          '<div style="display:flex;align-items:center;gap:10px;margin-top:22px;font:600 13px \'Geist Mono\',monospace;color:' + accent + '">' + cta + ' <span style="width:30px;height:30px;border:1.5px solid ' + accent + ';border-radius:50%;display:flex;align-items:center;justify-content:center">' + (ext ? "↗" : "→") + '</span></div>' +
        '</div></a>';
  })();

  // Categories (derived from posts) + an optional "↗ Reposts" filter
  var cats = ["All"];
  POSTS.forEach(function (p) { catsOf(p).forEach(function (c) { if (cats.indexOf(c) < 0) cats.push(c); }); });
  if (hasExt) cats.push("↗ Reposts");
  function chipStyle(on, isRepostChip) {
    var onColor = isRepostChip ? "#b07227" : "#2f5436";
    return "appearance:none;cursor:pointer;font:600 12px 'Geist Mono',monospace;letter-spacing:.04em;padding:8px 15px;border-radius:30px;transition:all .15s;" +
      (on ? "background:" + onColor + ";color:#f0e8d6;border:1.5px solid " + onColor : "background:transparent;color:#5e5238;border:1.5px solid rgba(34,28,16,.22)");
  }
  cats.forEach(function (label) {
    var isRepostChip = label === "↗ Reposts";
    var b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.setAttribute("data-cat", label);
    b.setAttribute("style", chipStyle(label === "All", isRepostChip));
    b.addEventListener("click", function () { setActive(label); });
    chipsEl.appendChild(b);
  });

  // List
  listEl.innerHTML = POSTS.map(function (p) {
    var ext = isExt(p);
    var accent = ext ? "#b07227" : "#2f5436";
    var eyebrow = ext ? ('↗ ' + esc(p.source || "External")) : catsOf(p).map(esc).join(" · ");
    var titleSuffix = ext ? ' <span style="color:#8a5a18;font-size:.8em">↗</span>' : '';
    var rowBg = ext ? "background:linear-gradient(90deg,rgba(176,114,39,.06),transparent 55%);" : "";
    var noteBlock = (ext && p.note)
      ? '<p style="font:italic 400 14px/1.5 \'Geist\',sans-serif;color:#7a6a48;margin:8px 0 0;padding-left:12px;border-left:2px solid #b07227;max-width:620px">' + esc(p.note) + '</p>'
      : '';
    var rightCol = ext ? esc(p.read || "link") : esc(p.read);
    return '<a href="' + esc(postHref(p)) + '"' + linkAttrs(p) + ' data-cats="' + esc(catsOf(p).join("|")) + '" data-ext="' + (ext ? "1" : "0") + '" class="hv3" style="' + rowBg + 'display:flex;flex-wrap:wrap;gap:14px 28px;align-items:baseline;padding:24px 0;border-top:1px solid rgba(34,28,16,.16)">' +
      '<div style="flex:0 0 auto;width:118px;font:600 11px \'Geist Mono\',monospace;color:#a89878;padding-top:5px">' + esc(p.date) + '</div>' +
      '<div style="flex:1 1 420px;min-width:260px">' +
        '<div style="font:600 11px \'Geist Mono\',monospace;letter-spacing:.08em;text-transform:uppercase;color:' + accent + ';margin-bottom:6px">' + eyebrow + '</div>' +
        '<h3 style="font:700 clamp(21px,2.4vw,27px)/1.18 \'Geist\',sans-serif;letter-spacing:-.02em;color:#221c10;margin:0">' + esc(p.title) + titleSuffix + '</h3>' +
        '<p style="font:400 15px/1.55 \'Geist\',sans-serif;color:#5e5238;margin:8px 0 0;max-width:620px">' + esc(p.dek) + '</p>' +
        noteBlock +
      '</div>' +
      '<div style="flex:0 0 auto;margin-left:auto;font:500 12px \'Geist Mono\',monospace;color:#a89878;padding-top:5px">' + rightCol + '</div>' +
    '</a>';
  }).join("");

  var postLinks = listEl.querySelectorAll("a[data-cats]");
  function setActive(active) {
    chipsEl.querySelectorAll("button[data-cat]").forEach(function (b) {
      var lbl = b.getAttribute("data-cat");
      b.setAttribute("style", chipStyle(lbl === active, lbl === "↗ Reposts"));
    });
    var reposts = active === "↗ Reposts";
    var shown = 0;
    postLinks.forEach(function (a) {
      var rowCats = (a.getAttribute("data-cats") || "").split("|");
      var m = active === "All" || (reposts ? a.getAttribute("data-ext") === "1" : rowCats.indexOf(active) >= 0);
      a.style.display = m ? "flex" : "none"; if (m) shown++;
    });
    headingEl.textContent = active === "All" ? "All writing" : (reposts ? "Reposts & links" : active);
    shownEl.textContent = shown + " shown";
  }
  setActive("All");
})();
</script>

<script src="/ks.js"></script>
