<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://kitesink.com/fitness/{{slug}}">
<link rel="alternate" type="text/markdown" href="https://kitesink.com/fitness/{{slug}}.md" title="Plain-text version">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KiteSink">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://kitesink.com/fitness/{{slug}}">
<meta property="og:image" content="https://kitesink.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="https://kitesink.com/og-image.png">
<meta name="theme-color" content="#ece2cb">
<script type="application/ld+json">{{breadcrumb}}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.ksTheme;if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
<link rel="stylesheet" href="/ks.css?v=2027.21">
<link rel="stylesheet" href="/fitness.css?v=2027.21">
</head>
<body class="ks-paper k2 fr" data-areas="{{areas}}">
<a class="k-skip" href="#main">Skip to content</a>
<div data-ks="header" data-active="fitness"></div>

<!-- GENERATED by scripts/build_fitness.py from content/fitness/. Do not edit this page by hand:
     change the data, content/fitness/routes.json or content/fitness/templates/sub.html. -->
<nav class="fr-nav" id="fr-nav" aria-label="Fitness pages"><div class="k-wrap">
  <div class="fr-nav-bar">
    <a class="fr-nav-hub" href="/fitness">Fitness</a>
    {{subnav_here}}
    <button type="button" class="fr-nav-t" id="fr-nav-t" aria-expanded="false" aria-controls="fr-nav-in" hidden>All {{n:pages}} pages</button>
  </div>
  <div class="fr-nav-in" id="fr-nav-in">
    {{subnav}}
  </div>
</div></nav>
<!-- The full list of pages starts folded behind its button; Escape folds it again. Without scripts it stays open. -->
<script>(function(n,b){if(!n||!b)return;n.classList.add("is-shut");b.hidden=false;function set(shut){n.classList.toggle("is-shut",shut);b.setAttribute("aria-expanded",shut?"false":"true")}b.addEventListener("click",function(){set(!n.classList.contains("is-shut"))});n.addEventListener("keydown",function(e){if(e.key==="Escape"&&!n.classList.contains("is-shut")){set(true);b.focus()}})})(document.getElementById("fr-nav"),document.getElementById("fr-nav-t"))</script>

<main id="main">

  <section class="k-hero k-wrap fr-hero" aria-labelledby="page-title">
    <div class="fr-hero-in">
      <div class="fr-hero-copy">
        <nav class="k-crumb fr-crumb" aria-label="Breadcrumb"><ol>{{crumb}}</ol></nav>
        <h1 class="k-h1" id="page-title">{{h1}}</h1>
        <p class="k-lead">{{lead}}</p>
        <p class="hero-note">Working notes from someone who trains, not a coach or a dietitian. General information, not medical advice.</p>
      </div>
      {{card}}
    </div>
  </section>

{{body}}

</main>

<div data-ks="footer" data-active="fitness"></div>

<script src="/ks.js?v=2027.21"></script>
<script src="/fitness-ref.js?v=2027.21"></script>
</body>
</html>
